name: Despliegue de Producción
on:
  push:
    branches:
      - main

# Esto le dice a GitHub que trabaje dentro de tu carpeta de proyecto
defaults:
  run:
    working-directory: ./pronalfut_website-main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de repositorio
        uses: actions/checkout@v4

      - name: Instalación de dependencias
        run: npm install

      - name: Construcción del proyecto
        run: npm run build

      - name: Despliegue a Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          # Aquí también ajustamos la ruta para que Netlify la encuentre
          publish-dir: './pronalfut_website-main/dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-config-path: ./pronalfut_website-main/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
